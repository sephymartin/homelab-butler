name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch: # 允许手动触发

env:
  # 镜像配置
  IMAGE_NAME: homelab-butler
  REGISTRY: crpi-n0jv1narbef6jqec.cn-shanghai.personal.cr.aliyuncs.com
  NAMESPACE: sephy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Aliyun ACR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.ALIYUN_REGISTRY_USER }}
        password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        
    - name: Generate timestamp tag
      id: timestamp
      run: |
        TIMESTAMP=$(date +%Y%m%d%H%M%S)
        echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
        echo "Generated timestamp: $TIMESTAMP"
        
    - name: Build and push Docker image
      run: |
        # 给build.sh脚本添加执行权限
        chmod +x build.sh
        
        # 使用build.sh脚本构建并推送镜像
        ./build.sh \
          --name ${{ env.IMAGE_NAME }} \
          --tag ${{ steps.timestamp.outputs.timestamp }} \
          --registry ${{ env.REGISTRY }}/${{ env.NAMESPACE }} \
          --use-buildx \
          --multi-platform \
          --push \
          --verbose
        
    - name: Output image information
      run: |
        echo "✅ 镜像构建并推送成功!"
        echo "📦 镜像名称: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}"
        echo "🏷️  镜像标签: ${{ steps.timestamp.outputs.timestamp }}"
        echo "🔗 完整镜像地址: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.timestamp.outputs.timestamp }}"
        echo "🌐 支持平台: linux/amd64, linux/arm64"
